[project]
name = "jev-ultrafast"
version = "0.1.0"
description = "A personal browser agent driven by a tree of skills."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "browser-harness==0.1.13",
    "google-auth-oauthlib>=1.2",
    "httpx[http2]>=0.28,<1",
]

[project.scripts]
jev = "jev_ultrafast.command:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

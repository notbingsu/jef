# jev's settings. Nothing here is secret: API keys go in .env, which is git-ignored.
# Missing keys take the default shown. Unknown keys are rejected, so a typo fails loudly.

# How much of each run to keep in artifacts/runs/:
#   "full"  everything "low" keeps, plus the page text, every model request and raw answer, and every
#           probability, latency and token count (default; the level that explains why a run came out as it did)
#   "low"   the strings passed and the actions taken: the goal in your words, each action and its text, the
#           arguments an API skill sent, and the run's answer. No page content and no model metadata
#   "off"   nothing
# One run can differ: jev --trace full ...
trace = "low"

# TypeSafe model. Pin a version (e.g. "jev-1.13.0") to keep answers stable when the alias moves.
# typesafe_model = "jev-latest"

# The long-running jev server: requests start in milliseconds and background tabs stay warm.
# server = true                 # --no-server runs one request in-process
# server_idle_minutes = 10      # exits after this long with nothing to do
# run_timeout_seconds = 180     # a run stops at its next safe point after this long
# approval_wait_seconds = 120   # how long to wait for you to click Allow on Chrome's remote-debugging prompt

# Text model for TYPE_TEXT, calendar arguments and reports. A claude-* model uses the Anthropic API.
text_model = "claude-haiku-4-5"
# Only for a model that isn't claude-*: its OpenAI-compatible endpoint, and "none" to turn reasoning off.
# text_model_base_url = "https://api.deepseek.com/v1"
# text_model_reasoning = "low"

# Numeric Telegram ids allowed to drive jev from a chat (jev-telegram). Empty means nobody: a chat request
# drives your logged-in Chrome and your calendar. @userinfobot tells you yours.
telegram_allowed = [494072734]

description = "Google Calendar"
# Preferences ported from tele_gcal's preferences.json. They reach the API operations and the browser skills.
rules = [
  "Take the event title from the details; if none is given, suggest a short one from the context.",
  "Leave location, description and guests empty unless the details give them.",
  "Only add guests whose email addresses appear in the details; never guess an email from a name.",
  "For a multi-day event given only as dates, make it one all-day event across those dates.",
]

[options]
calendar_id = "primary"     # `jev list my calendars` shows the IDs
# timezone = "Asia/Singapore"  # default: the calendar's own time zone
default_duration_minutes = 60
max_results = 10

# Google's colorId (1-11) per category; create/update pick one when it clearly fits.
[options.colors]
class = "1"
entertainment = "3"
going_out = "3"
physical = "6"
meetings = "7"
critical = "11"

# Searching for one of these categories lists the time range and matches any of its keywords
# in an event's title, description or location.
[options.keywords]
flights = ["flight", "airline", "boarding", "gate", "terminal", "SQ", "UA", "AA", "DL"]
"career fairs" = ["career fair", "career expo", "job fair", "recruitment"]
interviews = ["interview", "screening", "onsite", "loop"]
meetings = ["meeting", "sync", "standup", "1:1"]
travel = ["trip", "travel", "hotel", "check-in", "checkout", "flight"]
